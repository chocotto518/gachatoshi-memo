<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- iPhoneがJANコードなどの長い数字を電話番号と判断してリンク（下線）にしないようにする -->
  <meta name="format-detection" content="telephone=no">
  <title>ガチャとし MEMO</title>
  <!-- テスト公開中は検索エンジンに載せない。本物のデータに差し替えて正式公開するときに消す -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="牛島若利くんが入っているカプセルトイを、メーカーを越えて一覧で見られる非公式ファンサイトです。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+Antique:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- 数字だけNunito（0〜9の文字だけを読み込む） -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;700&text=0123456789&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="sheet">
  <!-- 影はノートの形（くり抜いた穴を含む）に沿って落とす -->
  <div class="notebook-shadow">
  <main class="notebook" id="notebook">

    <!-- 一覧ページ -->
    <section class="view view--list" id="view-list">
      <!-- 制作中の表示（正式公開するときに消す） -->
      <p class="wip-label">制作中・掲載データは仮です</p>

      <h1 class="site-title">
        <!-- タイトル画像（Figmaから書き出し） -->
        <img src="images/title.svg" width="297" height="38" alt="ガチャとし MEMO">
      </h1>

      <p class="notice">
        当サイトは、個人が運営する牛島若利くんの非公式ファンサイトです。<br>
        原作者様・出版社様・各メーカー様とは一切関係ありません。<br>
        「ハイキュー!!」の著作権は以下に帰属します。<br>
        ©古舘春一／集英社・「ハイキュー!!」製作委員会
      </p>

      <div class="chips" id="chips" role="group" aria-label="カテゴリで絞り込み"></div>

      <p class="count" id="count" aria-live="polite"></p>

      <ul class="card-list" id="card-list"></ul>
    </section>

    <!-- 詳細ページ -->
    <section class="view view--detail" id="view-detail" hidden></section>
  </main>
  </div>

  <!-- リング（数は画面幅からJSで決める）。影を付けないよう、ノートとは別の層に置く -->
  <div class="binding" id="binding" aria-hidden="true"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/app.js"></script>
</body>
</html>
